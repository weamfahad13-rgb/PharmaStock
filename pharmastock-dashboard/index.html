<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PharmaStock | إدارة المخزون الذكية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>document.write('<link rel="stylesheet" href="css/style.css?v=' + Date.now() + '">');</script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>
        </div>
        <div class="brand-text">
          <strong>PharmaStock</strong>
          <span>إدارة المخزون الذكية</span>
        </div>
      </div>

      <nav class="nav">
        <a href="#home" data-page="home"><span class="nav-icon" data-icon="home"></span><span>الرئيسية</span></a>
        <a href="#med" data-page="med"><span class="nav-icon" data-icon="pill"></span><span>الأدوية</span></a>
        <a href="#perf" data-page="perf"><span class="nav-icon" data-icon="chart"></span><span>أداء النظام</span></a>
      </nav>

      <div class="sidebar-foot">
        <span>آخر تحديث للبيانات</span>
        <b id="dataMonth">—</b>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">الرئيسية</h1>
          <p id="pageSub"></p>
        </div>
        <div class="topbar-actions">
          <span class="month-pill" id="monthPill"></span>
          <div class="bell-wrap">
            <button class="icon-btn" id="bellBtn" aria-label="التنبيهات">
              <span data-icon="bell"></span>
              <span class="badge" id="bellCount" hidden></span>
            </button>
            <div class="popover" id="bellPop" hidden></div>
          </div>
          <div class="avatar" title="الصيدلي">ص</div>
        </div>
      </header>

      <section id="view"></section>
    </main>
  </div>

  <script>document.write('<script src="data/data.js?v=' + Date.now() + '"><\/script>');</script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>document.write('<script src="js/app.js?v=' + Date.now() + '"><\/script>');</script>
  <script>document.write('<script src="js/chat.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
